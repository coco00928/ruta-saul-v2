<style>
:root{
  --bg:#0a0f1e;--surface:#111827;--surface2:#1a2535;--surface3:#1e2d45;
  --border:#1e2d45;--border2:#2a3f5f;
  --green:#00e5a0;--green-d:#00e5a015;
  --yellow:#f0b429;--yellow-d:#f0b42915;
  --red:#ff4d6d;--red-d:#ff4d6d15;
  --blue:#3d9cf0;--blue-d:#3d9cf015;
  --purple:#a78bfa;--purple-d:#a78bfa15;
  --orange:#f97316;--orange-d:#f9731615;
  --text:#e2e8f0;--muted:#64748b;--muted2:#94a3b8;
  --mono:'SF Mono',SFMono-Regular,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;}
.hdr{padding:max(14px,env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;}
.hdr-row{display:flex;justify-content:space-between;align-items:center;}
.hdr-logo{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:6px;}
.hdr-sub{font-size:9px;color:var(--muted);margin-top:2px;}
.hdr-cap{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--green);text-align:right;}
.hdr-cap-lbl{font-size:9px;color:var(--muted);text-align:right;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;display:inline-block;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.scroll::-webkit-scrollbar{display:none;}
.pad{padding:14px 16px 30px;}
.nav{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:max(8px,env(safe-area-inset-bottom));}
.nb{flex:1;padding:9px 2px 8px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:2px solid transparent;}
.nb.on{border-top-color:var(--green);}
.ni{font-size:17px;line-height:1;}
.nl{font-size:9px;color:var(--muted);}
.nb.on .nl{color:var(--green);font-weight:700;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
.card-tap{cursor:pointer;transition:opacity .15s;}
.card-tap:active{opacity:.65;}
.sec{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin:16px 0 10px;display:flex;align-items:center;gap:8px;}
.sec::after{content:'';flex:1;height:1px;background:var(--border);}
.bdg{display:inline-block;font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.4px;white-space:nowrap;}
.bg{background:var(--green-d);color:var(--green);}
.br{background:var(--red-d);color:var(--red);}
.by{background:var(--yellow-d);color:var(--yellow);}
.bb{background:var(--blue-d);color:var(--blue);}
.bp{background:var(--purple-d);color:var(--purple);}
.bar-bg{height:4px;background:var(--border);border-radius:4px;overflow:hidden;margin:5px 0 2px;}
.bar-fill{height:100%;border-radius:4px;transition:width .5s;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.mt{background:var(--surface2);border-radius:10px;padding:10px;}
.ml{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.mv{font-family:var(--mono);font-size:12px;font-weight:700;}
.hero{background:linear-gradient(135deg,#0a1e36,#0d1420);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;text-align:center;}
.hero-cap{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--green);letter-spacing:-1px;}
.hero-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.hero-stats{display:flex;justify-content:center;gap:18px;margin-top:12px;}
.hs{text-align:center;}
.hs .v{font-family:var(--mono);font-size:17px;font-weight:700;}
.hs .l{font-size:9px;color:var(--muted);margin-top:1px;}
.hsdiv{width:1px;background:var(--border);}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:480px;}
th{background:var(--surface2);color:var(--muted);font-weight:600;padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.inp{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:5px 7px;width:100%;font-size:11px;font-family:var(--mono);outline:none;min-width:60px;}
.inp:focus{border-color:var(--green);}
.inp-sm{min-width:50px;width:65px;}
.inp-md{min-width:70px;width:85px;}
.inp-lg{min-width:90px;width:110px;}
.btn-add{width:100%;background:var(--green-d);border:1px dashed var(--green);color:var(--green);border-radius:10px;padding:11px;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px;}
.btn-add:active{opacity:.7;}
.btn-del{background:transparent;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:3px 5px;}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:200;align-items:flex-end;}
.modal.open{display:flex;}
.modal-inner{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-height:85vh;overflow-y:auto;padding-bottom:max(20px,env(safe-area-inset-bottom));}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:var(--surface2);border:none;color:var(--muted);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;}
.lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;}
.inp-full{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-size:13px;outline:none;margin-bottom:14px;-webkit-appearance:none;}
.inp-full:focus{border-color:var(--green);}
select.inp-full{cursor:pointer;}
.btn-save{width:100%;background:var(--green);border:none;color:#080c14;border-radius:10px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-cancel{width:100%;background:transparent;border:none;color:var(--muted);padding:10px;font-size:13px;cursor:pointer;margin-top:6px;}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);color:var(--text);padding:10px 18px;border-radius:20px;font-size:12px;opacity:0;transition:all .3s;z-index:300;white-space:nowrap;border:1px solid var(--border2);pointer-events:none;}
.live-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.live-bdg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--green);background:var(--green-d);padding:4px 10px;border-radius:20px;}
.spin{animation:spin 1s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}
.upd-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:8px;font-size:10px;cursor:pointer;}
.sofi-card{background:var(--surface2);border-radius:12px;padding:13px;margin-bottom:8px;border:1px solid var(--border);}
.radar-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;}
.radar-card.zona{border-color:var(--green);}
.ag-item{border-radius:12px;padding:12px 13px;margin-bottom:8px;border-left-width:3px;border-left-style:solid;}
.noticia-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;}
</style>

function cargar(){
  const fresh=()=>JSON.parse(JSON.stringify(DEF));
  try{
    const s=localStorage.getItem('ruta_saul_v5');
    if(!s) return fresh();
    const d=JSON.parse(s);
    // Merge defensivo: conserva los datos del usuario y rellena campos nuevos del DEF
    const m=Object.assign(fresh(),d);
    if(!Array.isArray(m.cripto)) m.cripto=fresh().cripto;
    // Migración: en versiones viejas el costo de cripto venía como precio POR UNIDAD;
    // el modelo usa costo TOTAL (cant × precio prom). Detecta y convierte.
    m.cripto.forEach(c=>{
      if(c&&c.cant>0&&c.costo>c.pm*10) c.costo=+(c.costo*c.cant).toFixed(2);
    });
    if(typeof m.apiKey!=='string') m.apiKey='';
    if(typeof m.tipoCambio!=='number'||!(m.tipoCambio>0)) m.tipoCambio=fresh().tipoCambio;
    return m;
  }catch(e){ return fresh(); }
}
function guardar(){ try{ localStorage.setItem('ruta_saul_v5',JSON.stringify(D)); }catch(e){} }

function totalGBM(){ return D.gbm.reduce((s,a)=>s+(a.tits*a.pm),0); }
function totalCripto(){ return D.cripto.reduce((s,c)=>s+c.pm,0); }
function totalSofipos(){ return D.sofipos.reduce((s,x)=>s+x.saldo,0); }
function totalFinsus(){ 
  // Usa el saldo directo si existe, sino suma aportaciones
  const p=D.pilares.find(x=>x.id==='fins');
  return p.saldo||D.finsus.aportaciones.reduce((s,a)=>s+a.monto,0); 
}

function totalPilares(){
  const gbmV=totalGBM(), criptoV=totalCripto(), sofiV=totalSofipos(), finsV=totalFinsus();
  return D.pilares.reduce((s,p)=>{
    if(p.id==='gbm')   return s+gbmV;
    if(p.id==='bitso') return s+criptoV;
    if(p.id==='sofi')  return s+sofiV;
    if(p.id==='fins')  return s+finsV;
    return s+p.saldo;
  },0);
}

function poderDeCompra(){
  const base=D.poderCompra.efectivo;
  return D.poderCompra.incluirAporte?base+D.poderCompra.aporteSemanal:base;
}

function fraseDeLaSemana(){
  const diff=new Date()-new Date(new Date().getFullYear(),0,1);
  const semana=Math.floor(diff/(7*24*60*60*1000));
  return D.frases[semana%D.frases.length];
}

function sparkline(data,color,w=70,h=24){
  if(!data||data.length<2) return '';
  const min=Math.min(...data),max=Math.max(...data),range=max-min||1;
  const pts=data.map((v,i)=>{
    return `${((i/(data.length-1))*w).toFixed(1)},${(h-((v-min)/range)*h).toFixed(1)}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

// PRECIOS EN TIEMPO REAL
// Fuente 1: TwelveData (requiere key propia en localStorage, modal 🔑 Key)
// Fuente 2: Frankfurter (gratis, sin key) solo para el tipo de cambio USD/MXN
// Sin key de TwelveData, acciones/fibras/cripto se editan manualmente sin romper nada.
// (En 2026 no hay fuente gratuita sin key para acciones consultable desde el navegador:
//  Stooq retiró su endpoint CSV y Yahoo Finance no permite CORS desde el navegador.)
// ══════════════════════════════════════════
async function actualizarPrecios(){
  if(actualizando) return;
  actualizando=true;
  const ic=document.getElementById('live-ic');
  const btn=document.getElementById('upd-btn');
  if(ic) ic.className='spin';
  if(btn) btn.textContent='Actualizando...';
  let updated=0;
  const PU={}; // clave -> "MON:precioPorUnidad"

  // ── Fuente 1: TwelveData ──
  if(D.apiKey){
    try{
      const symsGBM=D.gbm.map(a=>a.td).filter(Boolean).join(',');
      const symsRadar=D.radar.filter(r=>r.yt).map(r=>r.yt).join(',');
      const allSyms=[symsGBM,symsRadar,'BTC/MXN','XRP/MXN','USD/MXN'].filter(Boolean).join(',');
      const r=await fetch(`https://api.twelvedata.com/price?symbol=${encodeURIComponent(allSyms)}&apikey=${D.apiKey}`,{signal:AbortSignal.timeout(12000)});
      const j=await r.json();
      // Respuesta: {SYMBOL:{price:"..."}} o plana si un solo símbolo
      const getP=(sym)=>{
        if(j[sym]&&j[sym].price) return parseFloat(j[sym].price);
        if(j.price&&allSyms===sym) return parseFloat(j.price);
        return null;
      };
      D.gbm.forEach(a=>{ const p=a.td&&getP(a.td); if(p) PU['gbm:'+a.t]='MXN:'+p; });
      D.radar.forEach(rr=>{ const p=rr.yt&&getP(rr.yt); if(p) PU['radar:'+rr.t]='USD:'+p; });
      const tc=getP('USD/MXN'); if(tc) PU['fx']='MXN:'+tc;
      const btc=getP('BTC/MXN'); if(btc) PU['cripto:BTC']='MXN:'+btc;
      const xrp=getP('XRP/MXN'); if(xrp) PU['cripto:XRP']='MXN:'+xrp;
    }catch(e){ /* cae al respaldo */ }
  }

  // ── Fuente 2: Frankfurter (gratis, sin key) para el tipo de cambio USD/MXN ──
  try{
    if(!PU['fx']){
      const r=await fetch('https://api.frankfurter.dev/v1/latest?from=USD&to=MXN',{signal:AbortSignal.timeout(10000)});
      const j=await r.json();
      const fx=j&&j.rates&&j.rates.MXN;
      if(fx&&fx>0) PU['fx']='MXN:'+fx;
    }
  }catch(e){ /* sin red: se conserva el tipo de cambio manual */ }

  // ── Aplicar ──
  const fxV=PU['fx']?parseFloat(PU['fx'].split(':')[1]):null;
  if(fxV&&fxV>0) D.tipoCambio=fxV;
  const usdMxn=(fxV&&fxV>0)?fxV:(D.tipoCambio||19.5);
  // GBM: BMV viene en MXN; símbolos EEUU (td sin ':BMV') vienen en USD → convertir
  D.gbm.forEach(a=>{
    const v=PU['gbm:'+a.t];
    if(v){
      const parts=v.split(':');
      let px=parseFloat(parts[1]);
      if(a.td&&!a.td.includes(':')) px=px*usdMxn;
      a.pm=parseFloat(px.toFixed(2)); a.ultAct=new Date().toISOString(); updated++;
    }
  });
  // Radar: se almacena en USD
  D.radar.forEach(rr=>{
    const v=PU['radar:'+rr.t];
    if(v){ rr.precio=parseFloat(parseFloat(v.split(':')[1]).toFixed(2)); updated++; }
  });
  // Cripto: pm es el VALOR TOTAL de la posición (precio unidad × cantidad)
  ['BTC','XRP'].forEach(sym=>{
    const c=D.cripto.find(x=>x.t===sym);
    const v=PU['cripto:'+sym];
    if(c&&v){
      const parts=v.split(':'), pxU=parseFloat(parts[1]);
      const pxMXN=parts[0]==='USD'?pxU*usdMxn:pxU;
      c.pm=+(pxMXN*c.cant).toFixed(2);
      if(!c.historial) c.historial=[];
      c.historial.push(c.pm);
      if(c.historial.length>10) c.historial.shift();
      updated++;
    }
  });

  D.ultimaActGlobal=new Date().toISOString();
  guardar(); renderTab();
  toast(updated>0?`✓ ${updated} precios actualizados`:'Sin precios nuevos');
  actualizando=false;
}

function tplGBM(){
  let tComp=0,tMkt=0;
  D.gbm.forEach(a=>{tComp+=a.tits*a.pp;tMkt+=a.tits*a.pm;});
  const tPlus=tMkt-tComp,tPlusPct=tComp>0?(tPlus/tComp*100):0;
  const pc=D.poderCompra,totalPC=poderDeCompra();

  const ultAct=D.ultimaActGlobal;
  let ultTxt='Nunca actualizado',ultColor='var(--red)';
  if(ultAct){
    const mins=Math.floor((Date.now()-new Date(ultAct))/60000);
    if(mins<1){ultTxt='Actualizado ahora';ultColor='var(--green)';}
    else if(mins<60){ultTxt=`Actualizado hace ${mins} min`;ultColor='var(--green)';}
    else if(mins<1440){ultTxt=`Actualizado hace ${Math.floor(mins/60)}h`;ultColor='var(--yellow)';}
    else{ultTxt=`Actualizado hace ${Math.floor(mins/1440)}d`;ultColor='var(--red)';}
  }

  const gruposH=['Global','México','FIBRA'].map(g=>{
    const stocks=D.gbm.filter(a=>a.g===g);
    const rows=stocks.map(a=>{
      const idx=D.gbm.indexOf(a);
      const tm=a.tits*a.pm,tc=a.tits*a.pp,plus=tm-tc;
      const plusPct=tc>0?(plus/tc*100):0;
      const cfg=sCfg[a.st]||sCfg.mantener;
      return `<tr>
        <td><div style="font-family:var(--mono);font-weight:700;font-size:11px">${a.t}</div><div style="font-size:9px;color:var(--muted)">${a.n}</div></td>
        <td><input class="inp inp-sm" type="number" value="${a.tits}" onchange="updGBM(${idx},'tits',this.value)"></td>
        <td><input class="inp inp-md" type="number" step="0.01" value="${a.pp.toFixed(2)}" onchange="updGBM(${idx},'pp',this.value)"></td>
        <td><input class="inp inp-md" type="number" step="0.01" value="${a.pm.toFixed(2)}" onchange="updGBM(${idx},'pm',this.value)"></td>
        <td style="font-family:var(--mono);color:var(--blue)">${fmtK(tm)}</td>
        <td style="font-family:var(--mono);color:${gc(plus)}">${pct(plusPct)}</td>
        <td><span class="bdg ${cfg.cls}">${cfg.l}</span></td>
        <td><button class="btn-del" onclick="delGBM(${idx})"><i class="fa fa-trash"></i></button></td>
      </tr>`;
    }).join('');
    return `
    <div class="sec">${gLbl[g]}</div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Ticker</th><th>Títs</th><th>P.Prom</th><th>P.Mkt</th><th>Total</th><th>+/−</th><th>Estado</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }).join('');

  return `
  <div class="live-row">
    <div class="live-bdg"><i id="live-ic" class="fa-solid fa-circle-dot"></i> Precios en vivo</div>
    <div style="display:flex;gap:6px">
      <button onclick="editApiKey()" class="upd-btn" style="color:var(--blue)">🔑 Key</button>
      <button id="upd-btn" class="upd-btn">⟳ Actualizar</button>
    </div>
  </div>
  <div style="font-size:10px;color:${ultColor};margin:-4px 0 12px;display:flex;align-items:center;gap:5px">
    <span style="width:5px;height:5px;border-radius:50%;background:${ultColor};display:inline-block"></span>${ultTxt}
  </div>
  <div style="background:var(--yellow-d);border:1px solid #f0b42930;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:11px;color:var(--muted2);line-height:1.5">
    ⚠️ Verifica precios en GBM antes de ejecutar órdenes reales.
  </div>
  ${!D.apiKey?`<div style="background:var(--blue-d);border:1px solid #3d9cf030;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:11px;color:var(--muted2);line-height:1.5">
    🔑 Sin API key: los precios se capturan manualmente. Toca <strong style="color:var(--blue)">🔑 Key</strong> para poner la tuya (gratis en twelvedata.com, 800 consultas/día) y el botón <strong>⟳ Actualizar</strong> traerá los precios solo.
  </div>`:''}
  <div class="card card-tap" onclick="editPoderCompra()" style="background:linear-gradient(135deg,#0a2436,#0d1420);border-color:var(--green)40;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">💵 Poder de Compra</div>
      <span style="font-size:9px;color:var(--muted)">✏️ editar</span>
    </div>
    <div style="font-family:var(--mono);font-size:24px;font-weight:700;color:var(--green)">${fmt(totalPC)}</div>
    <div style="font-size:10px;color:var(--muted2);margin-top:4px">
      Efectivo: ${fmt(pc.efectivo)} ${pc.incluirAporte?'+ Aportación: '+fmt(pc.aporteSemanal):'(sin aportación)'}
    </div>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="g3">
      <div class="mt"><div class="ml">Invertido</div><div class="mv">${fmtK(tComp)}</div></div>
      <div class="mt"><div class="ml">Mercado</div><div class="mv" style="color:var(--blue)">${fmtK(tMkt)}</div></div>
      <div class="mt"><div class="ml">Plusvalía</div><div class="mv" style="color:${gc(tPlus)}">${pct(tPlusPct)}</div></div>
    </div>
  </div>
  ${gruposH}
  <button class="btn-add" onclick="addGBM()">+ Agregar acción o FIBRA</button>`;
}

function tplDivs(){
  const avisosH=D.avisos.map((a,i)=>{
    // Si el activo es una posición Global (ej: MSFT), el monto viene en USD → convertir a MXN
    const gPos=D.gbm.find(x=>x.t===a.activo);
    const esUSD=(gPos&&gPos.g==='Global');
    const totalEst=a.monto*a.tits*(esUSD?(D.tipoCambio||1):1);
    return `<tr>
    <td style="font-family:var(--mono);font-weight:700">${a.activo}</td>
    <td><input class="inp inp-lg" type="date" value="${a.exDiv}" onchange="updAviso(${i},'exDiv',this.value)"></td>
    <td><input class="inp inp-lg" type="date" value="${a.pago}" onchange="updAviso(${i},'pago',this.value)"></td>
    <td><input class="inp inp-md" type="number" step="0.001" value="${a.monto}" onchange="updAviso(${i},'monto',this.value)"></td>
    <td><input class="inp inp-sm" type="number" value="${a.tits}" onchange="updAviso(${i},'tits',this.value)"></td>
    <td style="font-family:var(--mono);color:var(--green);font-weight:700">${fmt(totalEst)}${esUSD?'<div style="font-size:8px;color:var(--muted);font-weight:400">USD→MXN</div>':''}</td>
    <td><button class="btn-del" onclick="delAviso(${i})"><i class="fa fa-trash"></i></button></td>
  </tr>`;}).join('');

  // Agrupar por año — extrae los últimos 2 dígitos del campo mes (ej: 'Ene 25' → 2025)
  const porAno={};
  D.cobros.forEach((c,i)=>{
    const mAno=String(c.mes||'').match(/\b(\d{2})\s*$/);
    const ano=mAno?('20'+mAno[1]):'Otro';
    if(!porAno[ano]) porAno[ano]=[];
    porAno[ano].push({...c,idx:i});
  });

  let totalGeneral=0;
  const anosH=Object.keys(porAno).sort().map(ano=>{
    const items=porAno[ano];
    const totalAno=items.reduce((s,c)=>s+(c.bruto-c.isr),0);
    totalGeneral+=totalAno;

    // Resumen mensual
    const porMes={};
    items.forEach(c=>{
      if(!porMes[c.mes]) porMes[c.mes]=0;
      porMes[c.mes]+=(c.bruto-c.isr);
    });
    const resH=Object.entries(porMes).map(([m,t])=>
      `<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:11px;border-bottom:1px solid var(--border)">
        <span style="color:var(--muted2)">${m}</span>
        <span style="font-family:var(--mono);color:var(--green);font-weight:600">${fmt(t)}</span>
      </div>`).join('');

    const detH=items.map(c=>{
      const neto=c.bruto-c.isr;
      return `<tr>
        <td><input class="inp inp-sm" type="text" value="${c.mes}" onchange="updCobro(${c.idx},'mes',this.value)"></td>
        <td style="font-family:var(--mono);font-weight:700"><input class="inp inp-md" type="text" value="${c.activo}" onchange="updCobro(${c.idx},'activo',this.value)"></td>
        <td><input class="inp inp-md" type="number" step="0.001" value="${c.bruto}" onchange="updCobro(${c.idx},'bruto',this.value)"></td>
        <td><input class="inp inp-md" type="number" step="0.001" value="${c.isr}" onchange="updCobro(${c.idx},'isr',this.value)"></td>
        <td style="font-family:var(--mono);color:${gc(neto)};font-weight:700">${fmt(neto)}</td>
        <td><button class="btn-del" onclick="delCobro(${c.idx})"><i class="fa fa-trash"></i></button></td>
      </tr>`;
    }).join('');

    return `
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">
      <div class="card-tap" onclick="toggleAno('${ano}')" style="padding:13px;display:flex;justify-content:space-between;align-items:center;background:var(--surface2)">
        <div style="display:flex;align-items:center;gap:8px">
          <span id="ano-arrow-${ano}" style="font-size:11px;color:var(--muted)">▶</span>
          <span style="font-weight:700;font-size:14px">${ano}</span>
          <span style="font-size:10px;color:var(--muted)">(${items.length} pagos)</span>
        </div>
        <div style="font-family:var(--mono);font-size:15px;font-weight:700;color:var(--green)">${fmt(totalAno)}</div>
      </div>
      <div id="ano-content-${ano}" style="display:none">
        <div style="padding:10px 13px;border-top:1px solid var(--border)">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Resumen mensual neto</div>
          ${resH}
        </div>
        <div class="tbl-wrap" style="border:none;border-top:1px solid var(--border);border-radius:0">
          <table><thead><tr><th>Mes</th><th>Activo</th><th>Bruto</th><th>ISR</th><th>Neto</th><th></th></tr></thead>
          <tbody>${detH}</tbody></table>
        </div>
      </div>
    </div>`;
  }).join('');

  const sofiIntH=D.sofipos.map(s=>{
    const iMes=s.saldo*s.tasa/100/12;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
      <div><div style="font-size:12px;font-weight:600">${s.n}</div>
      <div style="font-size:10px;color:var(--muted)">${s.tasa}% anual sobre ${fmt(s.saldo)}</div></div>
      <div style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--green)">${fmt(iMes)}/mes</div>
    </div>`;
  }).join('');

  return `
  <div class="hero" style="padding:16px">
    <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px">Total Dividendos Cobrados (Neto)</div>
    <div class="hero-cap" style="font-size:24px">${fmt(totalGeneral)}</div>
    <div class="hero-sub">FIBRAs + Acciones MX · 2025-2026</div>
  </div>

  <div class="sec">📅 Próximos Pagos</div>
  <div class="card" style="padding:0;overflow:hidden">
    <div class="tbl-wrap"><table>
      <thead><tr><th>Activo</th><th>Ex-Div</th><th>Pago</th><th>$/Tít</th><th>Títs</th><th>Total Est.</th><th></th></tr></thead>
      <tbody>${avisosH}</tbody>
    </table></div>
  </div>
  <button class="btn-add" onclick="addAviso()">+ Agregar aviso de pago</button>

  <div class="sec">💵 Historial por Año <span style="font-size:8px">(toca para expandir)</span></div>
  ${anosH}
  <button class="btn-add" onclick="addCobro()">+ Registrar cobro</button>

  <div class="sec">🏦 Intereses SOFIPOs</div>
  <div class="card">
    ${sofiIntH}
    <div style="display:flex;justify-content:space-between;padding-top:10px;margin-top:2px">
      <div style="font-size:12px;font-weight:700">Total intereses/mes</div>
      <div style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--green)">${fmt(D.sofipos.reduce((s,x)=>s+(x.saldo*x.tasa/100/12),0))}</div>
    </div>

// Análisis del portafolio generado desde datos REALES (nada hardcodeado)
function buildNoticias(){
  const N=[];
  const gbmT=t=>D.gbm.find(a=>a.t===t);
  const w=gbmT('WALMEX');
  if(w&&w.pp>0){
    const p=(w.pm-w.pp)/w.pp*100;
    N.push({ic:'📊',t:'WALMEX — '+(p>=0?'En verde':'Acumulando en zona baja'),
      txt:`Con ${w.tits} acciones a costo prom ${fmt(w.pp)} y precio actual ${fmt(w.pm)}, llevas ${pct(p)}. Reporte Q3 en octubre y dividendo de noviembre como catalizadores próximos.`,
      color:p>=0?'var(--green)':'var(--blue)'});
  }
  const m=gbmT('MSFT');
  if(m&&m.pp>0){
    const p=(m.pm-m.pp)/m.pp*100;
    N.push({ic:'📈',t:'MSFT — '+(p>=0?'Recuperación sólida':'Bajo costo promedio'),
      txt:`Tu posición pasó de ${fmt(m.pp)} a ${fmt(m.pm)} — un ${pct(p)}. Tesis de largo plazo en tecnología.`,
      color:p>=0?'var(--green)':'var(--red)'});
  }
  const g=D.radar.find(r=>r.t==='GOOGL');
  if(g){
    const enZ=g.precio<=g.zMax;
    const dist=((g.precio-g.zMax)/g.precio*100).toFixed(1);
    N.push({ic:'🎯',t:'GOOGL — '+(enZ?'En zona de entrada':'Cerca de zona de entrada'),
      txt:`Cotiza en $${g.precio} USD. Tu zona ideal es $${g.zMin}-${g.zMax}. `+(enZ?'¡Entró a tu zona! Evalúa tu entrada.':`Está a ${dist}% de la zona; espera corrección para entrar.`),
      color:enZ?'var(--green)':'var(--yellow)'});
  }
  const btc=D.cripto.find(c=>c.t==='BTC');
  if(btc){
    const ct=btc.costo||0, gan=btc.pm-ct, gp=ct>0?gan/ct*100:0;
    N.push({ic:'₿',t:'BTC — Posición '+(gp>=0?'en verde':'en rojo'),
      txt:`Tu posición de ${btc.cant} BTC vale ${fmt(btc.pm)} (${pct(gp)} vs costo total ${fmt(ct)}). Continúa DCA semanal.`,
      color:'var(--orange)'});
  }
  const n=gbmT('NFLX');
  if(n&&n.pp>0){
    const p=(n.pm-n.pp)/n.pp*100;
    N.push({ic:'🔴',t:'NFLX — '+(p>=0?'En verde':'Sigue bajo costo promedio'),
      txt:`Con ${n.tits} acciones a ${fmt(n.pp)} costo prom y precio ${fmt(n.pm)}, llevas ${pct(p)}.`,
      color:p>=0?'var(--green)':'var(--red)'});
  }
  const intMes=D.sofipos.reduce((s,x)=>s+(x.saldo*x.tasa/100/12),0);
  N.push({ic:'💰',t:`SOFIPOs — ${fmt(intMes)} al mes en intereses`,
    txt:`${D.sofipos.map(s=>`${s.n} al ${s.tasa}%`).join(' · ')} generan ingreso pasivo mensual sin riesgo de mercado.`,
    color:'var(--green)'});
  return N;
}

function tplRadar(){
  const tc=D.tipoCambio;

  const radarH=D.radar.map((r,i)=>{
    const enZona=r.precio<=r.zMax;
    const casiZona=r.precio<=(r.zMax*1.08);
    const dist=((r.precio-r.zMax)/r.precio*100).toFixed(1);
    const fill=Math.min(100,Math.max(5,((r.precio-r.zMin*0.85)/(r.obj-r.zMin*0.85))*100));
    const pot=r.precio>0?((r.obj-r.precio)/r.precio*100):0; // potencial siempre calculado, nunca desfasado
    const pMXN=(r.precio*tc).toLocaleString('es-MX',{maximumFractionDigits:0});
    const zMinMXN=(r.zMin*tc).toLocaleString('es-MX',{maximumFractionDigits:0});
    const zMaxMXN=(r.zMax*tc).toLocaleString('es-MX',{maximumFractionDigits:0});
    const objMXN=(r.obj*tc).toLocaleString('es-MX',{maximumFractionDigits:0});

    let statusColor=enZona?'var(--green)':casiZona?'var(--yellow)':'var(--purple)';
    let statusTxt=enZona?'✅ EN ZONA — evalúa entrar':casiZona?`⚡ A ${dist}% de la zona`:`⏳ ${dist}% sobre zona`;

    return `<div class="radar-card ${enZona?'zona':''}" onclick="editRadar(${i})" style="${casiZona&&!enZona?'border-color:var(--yellow)40;':''}" >
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px">
        <div>
          <div style="font-family:var(--mono);font-size:14px;font-weight:700">${r.t}</div>
          <div style="font-size:10px;color:var(--muted)">${r.n}</div>
        </div>
        <div style="text-align:right">
          <div style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--yellow)">$${r.precio} USD</div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--blue);margin-top:1px">≈ $${pMXN} MXN</div>
          <div style="font-size:9px;color:${statusColor};margin-top:3px">${statusTxt}</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:3px">
        <span>Zona: $${r.zMin}–$${r.zMax} USD</span><span>Objetivo: $${r.obj} (+${pot.toFixed(0)}%)</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--blue);margin-bottom:5px">
        <span>≈ $${zMinMXN}–$${zMaxMXN} MXN</span><span>≈ $${objMXN} MXN</span>
      </div>
      <div class="bar-bg" style="height:3px">
        <div class="bar-fill" style="width:${fill}%;background:${statusColor}"></div>
      </div>
    </div>`;
  }).join('');

  // Análisis generado dinámicamente desde el portafolio real
  const noticias=buildNoticias();

  const noticiasH=noticias.map(n=>`
    <div class="noticia-card">
      <div style="display:flex;gap:8px;align-items:flex-start">
        <span style="font-size:16px">${n.ic}</span>
        <div>
          <div style="font-size:12px;font-weight:700;color:${n.color};margin-bottom:3px">${n.t}</div>
          <div style="font-size:11px;color:var(--muted2);line-height:1.5">${n.txt}</div>
        </div>
      </div>
    </div>`).join('');

  return `
  <div style="background:var(--purple-d);border:1px solid #a78bfa25;border-radius:12px;padding:13px;margin-bottom:14px">
    <div style="font-size:12px;color:var(--purple);font-weight:700;margin-bottom:3px">🎯 Estrategia de entrada</div>
    <div style="font-size:11px;color:var(--muted2);line-height:1.6">No entrar en máximos. Cada acción tiene zona verde ideal. Fuera de ella, esperamos. Toca para editar. ✅ En zona · ⚡ Casi · ⏳ Esperar</div>
  </div>

  <div class="card card-tap" onclick="editTipoCambio()" style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:14px">
    <div>
      <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">💱 Tipo de cambio USD/MXN</div>
      <div style="font-family:var(--mono);font-size:16px;font-weight:700;color:var(--blue)">$${tc.toFixed(4)}</div>
    </div>
    <span style="font-size:9px;color:var(--muted)">✏️ editar</span>
  </div>

  ${radarH}
  <button class="btn-add" onclick="addRadar()">+ Agregar al radar</button>

  <div class="sec">📰 Análisis de tu portafolio</div>
  ${noticiasH}`;
}

function editPilar(id){
  const p=D.pilares.find(x=>x.id===id);

function saveSofipo(id){
  const s=D.sofipos.find(x=>x.id===id);
  s.saldo=+document.getElementById('es-s').value||s.saldo;
  s.tasa=+document.getElementById('es-t').value||s.tasa;
  s.meta=+document.getElementById('es-m').value||s.meta;

// Cripto
function editCripto(i){
  const c=D.cripto[i];
  abrirModal(`<div class="modal-title">${c.ic} ${c.n} <button class="modal-close" onclick="cerrarModal()">✕</button></div>
  <label class="lbl">Cantidad de ${c.t}</label><input class="inp-full" type="number" id="ec-cant" value="${c.cant}" step="0.00000001">
  <label class="lbl">Valor total en MXN (actual)</label><input class="inp-full" type="number" id="ec-pm" value="${c.pm}" step="0.01">
  <label class="lbl">Costo total de compra (MXN)</label><input class="inp-full" type="number" id="ec-costo" value="${c.costo}" step="0.01">
  <label class="lbl">Cambio 24h (%)</label><input class="inp-full" type="number" id="ec-camb" value="${c.cambio24h||0}" step="0.01">
  <div style="background:var(--surface2);border-radius:8px;padding:10px;margin-bottom:14px;font-size:11px">
    <div style="color:var(--muted);margin-bottom:3px">Ganancia/Pérdida:</div>
    <div id="cripto-ganancia" style="font-family:var(--mono);font-weight:700;font-size:14px"></div>
  </div>
  <button class="btn-save" onclick="saveCripto(${i})">Guardar</button>
  <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>`);
  const calcGan=()=>{
    const pm=+document.getElementById('ec-pm').value||0;
    const costo=+document.getElementById('ec-costo').value||0;
    const gan=pm-costo;
    const el=document.getElementById('cripto-ganancia');
    el.style.color=gan>=0?'var(--green)':'var(--red)';
    el.textContent=(gan>=0?'+':'')+fmt(gan)+' ('+(costo>0?((gan/costo*100).toFixed(2)):'0.00')+'%)';
  };
  document.getElementById('ec-pm').oninput=document.getElementById('ec-costo').oninput=calcGan;
  calcGan();
}
function saveCripto(i){
  const nuevoPm=+document.getElementById('ec-pm').value||D.cripto[i].pm;
  D.cripto[i].cant=+document.getElementById('ec-cant').value||D.cripto[i].cant;
  D.cripto[i].costo=+document.getElementById('ec-costo').value||D.cripto[i].costo;
  D.cripto[i].cambio24h=+document.getElementById('ec-camb').value||0;
  if(nuevoPm!==D.cripto[i].pm){
    if(!D.cripto[i].historial)D.cripto[i].historial=[];
    D.cripto[i].historial.push(nuevoPm);
    if(D.cripto[i].historial.length>10)D.cripto[i].historial.shift();
  }
  D.cripto[i].pm=nuevoPm;
  guardar();cerrarModal();renderTab();
}

// RESPALDO — Exportar / Importar estado (JSON)
// ══════════════════════════════════════════
function exportarRespaldo(){
  try{
    const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='ruta-saul-respaldo-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('✓ Respaldo descargado');
  }catch(e){ toast('⚠️ No se pudo exportar'); }
}
function importarRespaldo(input){
  const f=input.files&&input.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.pilares)||!Array.isArray(d.gbm)) throw new Error('formato inválido');
      D=d; guardar(); renderTab();
      toast('✓ Respaldo restaurado');
    }catch(e){ toast('⚠️ Archivo inválido — no se cambió nada'); }
  };
  r.readAsText(f);
  input.value='';
}

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)';},2500);
}
